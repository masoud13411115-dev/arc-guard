name: Build Android APK
# Builds Manager and Guard debug APKs on every push to main.
# Uses Android productFlavors (manager + guard) so both APKs come from one
# Gradle project with different applicationId values. No config-file swapping.

on:
  push:
    branches: [main]
    paths:
      - "artifacts/arc-guard/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "artifacts/arc-guard/**"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Which APK variant to build"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - manager
          - guard

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 3. pnpm ──────────────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      # ── 4. JDK 21 ────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # ── 5. Android SDK 34 ────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      # ── 6. Caches ────────────────────────────────────────────────────────────
      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-flavors-v1
          restore-keys: |
            gradle-${{ runner.os }}-flavors-
            gradle-${{ runner.os }}-

      # ── 7. Install dependencies ───────────────────────────────────────────────
      - name: Install pnpm dependencies
        run: pnpm install --no-frozen-lockfile

      # ── 8. Vite production build ──────────────────────────────────────────────
      # Built once — same JS bundle for both APK variants.
      # CAP_ANDROID=1 -> base:'./' so file:// assets load in Android WebView.
      - name: Vite production build
        working-directory: artifacts/arc-guard
        run: pnpm build
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /arc-guard/
          CAP_ANDROID: "1"
          VITE_ARC_GUARD_API_KEY: ${{ secrets.VITE_ARC_GUARD_API_KEY }}
          VITE_ARC_GUARD_AUTH_DOMAIN: ${{ secrets.VITE_ARC_GUARD_AUTH_DOMAIN }}
          VITE_ARC_GUARD_PROJECT_ID: ${{ secrets.VITE_ARC_GUARD_PROJECT_ID }}
          VITE_ARC_GUARD_STORAGE_BUCKET: ${{ secrets.VITE_ARC_GUARD_STORAGE_BUCKET }}
          VITE_ARC_GUARD_MESSAGING_SENDER_ID: ${{ secrets.VITE_ARC_GUARD_MESSAGING_SENDER_ID }}
          VITE_ARC_GUARD_APP_ID: ${{ secrets.VITE_ARC_GUARD_APP_ID }}
          VITE_ARC_GUARD_MEASUREMENT_ID: ${{ secrets.VITE_ARC_GUARD_MEASUREMENT_ID }}
          VITE_ARC_GUARD_VAPID_KEY: ${{ secrets.VITE_ARC_GUARD_VAPID_KEY }}

      # ── 9. Bootstrap Android project (cap add + cap sync) ─────────────────────
      # android/ is not committed — scaffold fresh from Capacitor each run.
      - name: Bootstrap Android project
        working-directory: artifacts/arc-guard
        run: |
          echo "Scaffolding android/ with Capacitor..."
          npx cap add android
          echo "Syncing web assets into android/..."
          npx cap sync android
          echo "android/app/ contents:"
          ls android/app/
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /arc-guard/

      # ── 10. Write google-services.json ────────────────────────────────────────
      - name: Write google-services.json
        run: |
          DEST="artifacts/arc-guard/android/app/google-services.json"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > "$DEST"
            echo "google-services.json written from GitHub Secret"
          else
            printf '%s' "" | base64 -d > "$DEST"
            echo "Using demo placeholder google-services.json"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # ── 11. Patch build.gradle — inject productFlavors ────────────────────────
      # Calls the committed Python script (android-config/patch_gradle.py) which:
      #   - Inserts flavorDimensions + productFlavors (manager / guard) into
      #     android/app/build.gradle so both APKs get the right applicationId.
      #   - Removes app_name from strings.xml to avoid resValue duplicate conflict.
      - name: Inject productFlavors into build.gradle
        working-directory: artifacts/arc-guard
        run: python3 android-config/patch_gradle.py

      # ── 12. Make gradlew executable ───────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x artifacts/arc-guard/android/gradlew

      # ── 13. Build Manager APK — assembleManagerDebug ──────────────────────────
      # productFlavor "manager" -> applicationId "com.arcguard.manager"
      # Output: app/build/outputs/apk/manager/debug/app-manager-debug.apk
      - name: Build Manager debug APK
        if: ${{ github.event.inputs.flavor != 'guard' }}
        working-directory: artifacts/arc-guard/android
        run: |
          echo "Building Manager APK (com.arcguard.manager)..."
          ./gradlew assembleManagerDebug --no-daemon
          APK="app/build/outputs/apk/manager/debug/app-manager-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Manager APK not found at $APK"
            ls -R app/build/outputs/apk/ 2>/dev/null || echo "(no apk output)"
            exit 1
          fi
          cp "$APK" "app/build/outputs/apk/ARC-Guard-Manager-debug.apk"
          echo "Manager APK: $(du -sh "$APK" | cut -f1)"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 14. Build Guard APK — assembleGuardDebug ──────────────────────────────
      # productFlavor "guard" -> applicationId "com.arcguard.guard"
      # Output: app/build/outputs/apk/guard/debug/app-guard-debug.apk
      - name: Build Guard debug APK
        if: ${{ github.event.inputs.flavor != 'manager' }}
        working-directory: artifacts/arc-guard/android
        run: |
          echo "Building Guard APK (com.arcguard.guard)..."
          ./gradlew assembleGuardDebug --no-daemon
          APK="app/build/outputs/apk/guard/debug/app-guard-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Guard APK not found at $APK"
            ls -R app/build/outputs/apk/ 2>/dev/null || echo "(no apk output)"
            exit 1
          fi
          cp "$APK" "app/build/outputs/apk/ARC-Guard-Guard-debug.apk"
          echo "Guard APK: $(du -sh "$APK" | cut -f1)"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 15. Verify package IDs with aapt ─────────────────────────────────────
      # Informational: prints the package name and label from aapt dump badging.
      # Uses aapt2 (always present in build-tools 34) and anchored sed so
      # greedy matching cannot land on versionName= instead of name=.
      # This step does NOT fail the job — uploads always proceed.
      - name: Verify APK package IDs
        if: always()
        run: |
          # Prefer aapt2 (always present); fall back to aapt v1 if available
          if [ -x "$ANDROID_HOME/build-tools/34.0.0/aapt2" ]; then
            AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          else
            AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          fi
          BASE="artifacts/arc-guard/android/app/build/outputs/apk"
          PASS=true

          for ENTRY in "ARC-Guard-Manager-debug.apk:com.arcguard.manager" "ARC-Guard-Guard-debug.apk:com.arcguard.guard"; do
            FILE="${ENTRY%%:*}"
            WANT="${ENTRY##*:}"
            APK="$BASE/$FILE"
            if [ ! -f "$APK" ]; then
              echo "SKIP $FILE (not built this run)"
              continue
            fi
            # Dump raw first line for transparency, then parse with anchored sed
            echo "--- aapt badging (first 3 lines) ---"
            "$AAPT" dump badging "$APK" 2>&1 | head -3 || true
            echo "------------------------------------"
            BADGE=$("$AAPT" dump badging "$APK" 2>/dev/null)
            # Anchored at ^package: name=' so versionName= is never matched
            GOT=$(printf '%s' "$BADGE" | grep "^package:" | sed "s/^package: name='\([^']*\)'.*/\1/")
            LBL=$(printf '%s' "$BADGE" | grep "^application-label:" | sed "s/application-label:'\([^']*\)'/\1/")
            echo "$FILE -> package='$GOT'  label='$LBL'"
            if [ "$GOT" = "$WANT" ]; then
              echo "  PASS: package ID is correct"
            else
              echo "  INFO: got='$GOT' expected='$WANT' (may be aapt parsing artifact — check label above)"
              PASS=false
            fi
          done

          # Print result but do NOT exit 1 — uploads must proceed regardless
          if $PASS; then
            echo "All package IDs verified OK"
          else
            echo "::warning::aapt package-ID check had mismatches — inspect labels above; APKs are still uploaded"
          fi

      # ── 16. Upload Manager APK ────────────────────────────────────────────────
      # always() so the upload happens even if the verification step warns
      - name: Upload Manager APK
        if: ${{ always() && github.event.inputs.flavor != 'guard' }}
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Guard-Manager-debug
          path: artifacts/arc-guard/android/app/build/outputs/apk/ARC-Guard-Manager-debug.apk
          if-no-files-found: warn
          retention-days: 30

      # ── 17. Upload Guard APK ──────────────────────────────────────────────────
      - name: Upload Guard APK
        if: ${{ always() && github.event.inputs.flavor != 'manager' }}
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Guard-Guard-debug
          path: artifacts/arc-guard/android/app/build/outputs/apk/ARC-Guard-Guard-debug.apk
          if-no-files-found: warn
          retention-days: 30

      # ── 18. Build summary ─────────────────────────────────────────────────────
      - name: Write build summary
        if: always()
        run: |
          if [ -x "$ANDROID_HOME/build-tools/34.0.0/aapt2" ]; then
            AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          else
            AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          fi
          BASE="artifacts/arc-guard/android/app/build/outputs/apk"
          echo "## ARC Guard Android Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | Package ID | App Name | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          for ENTRY in "Manager:ARC-Guard-Manager-debug.apk" "Guard:ARC-Guard-Guard-debug.apk"; do
            LABEL="${ENTRY%%:*}"
            FILE="${ENTRY##*:}"
            APK="$BASE/$FILE"
            if [ -f "$APK" ]; then
              BADGE=$("$AAPT" dump badging "$APK" 2>/dev/null)
              PKG=$(printf '%s' "$BADGE" | grep "^package:" | sed "s/^package: name='\([^']*\)'.*/\1/")
              NM=$(printf '%s' "$BADGE" | grep "^application-label:" | sed "s/application-label:'\([^']*\)'/\1/")
              echo "| $LABEL | \`$PKG\` | $NM | Built |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $LABEL | -- | -- | Not built |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_APKs uploaded as GitHub Actions artifacts (30-day retention)._" >> $GITHUB_STEP_SUMMARY
