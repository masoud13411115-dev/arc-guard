name: Build Android APK
# Builds Manager and Guard debug APKs on every push to main

on:
  push:
    branches: [main]
    paths:
      - "artifacts/arc-guard/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "artifacts/arc-guard/**"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Which APK variant to build"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - manager
          - guard

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js 20 ────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 3. pnpm ──────────────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      # ── 4. JDK 17 ────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # ── 5. Android SDK 34 ────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      # ── 6. Caches ────────────────────────────────────────────────────────────
      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('artifacts/arc-guard/android/**/*.gradle*', 'artifacts/arc-guard/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 7. Install dependencies ───────────────────────────────────────────────
      - name: Install pnpm dependencies
        run: pnpm install --no-frozen-lockfile

      # ── 8. Bootstrap Android project ─────────────────────────────────────────
      # If android/ is not committed to the repo, scaffold it now with Capacitor.
      # This covers the first CI run before the developer commits android/.
      - name: Bootstrap Android project
        working-directory: artifacts/arc-guard
        run: |
          # Ensure @capacitor/android native runtime is available
          if ! pnpm list @capacitor/android --depth=0 2>/dev/null | grep -q "@capacitor/android"; then
            echo "Installing @capacitor/android..."
            pnpm add @capacitor/android --prefer-offline || pnpm add @capacitor/android
          fi
          if [ -d "android" ]; then
            echo "android/ found in repo — skipping cap add"
          else
            echo "android/ not committed — running cap add android..."
            npx cap add android
            echo "Android project scaffolded"
          fi
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /arc-guard/

      # ── 9. google-services.json ───────────────────────────────────────────────
      # mkdir -p ensures the directory exists whether android/ came from git or
      # was just scaffolded. The placeholder is base64-encoded to avoid YAML
      # heredoc indentation conflicts. It covers both package IDs so Gradle can
      # build a demo APK even without the real GOOGLE_SERVICES_JSON secret.
      - name: Write google-services.json
        run: |
          mkdir -p artifacts/arc-guard/android/app
          DEST="artifacts/arc-guard/android/app/google-services.json"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > "$DEST"
            echo "google-services.json written from GitHub Secret"
          else
            echo "" | base64 -d > "$DEST"
            echo "Using demo placeholder google-services.json (add GOOGLE_SERVICES_JSON secret for Firebase)"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # ── 10. Vite build + Capacitor sync — Manager ─────────────────────────────
      # PORT and BASE_PATH are required by vite.config.ts (throws if absent).
      # flavor input defaults to empty string on push/PR events, so != 'guard'
      # evaluates true and both builds run — correct default behavior.
      - name: Build Manager (Vite + cap sync)
        if: ${{ github.event.inputs.flavor != 'guard' }}
        working-directory: artifacts/arc-guard
        run: pnpm cap:build:manager
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /arc-guard/
          VITE_ARC_GUARD_API_KEY: ${{ secrets.VITE_ARC_GUARD_API_KEY }}
          VITE_ARC_GUARD_AUTH_DOMAIN: ${{ secrets.VITE_ARC_GUARD_AUTH_DOMAIN }}
          VITE_ARC_GUARD_PROJECT_ID: ${{ secrets.VITE_ARC_GUARD_PROJECT_ID }}
          VITE_ARC_GUARD_STORAGE_BUCKET: ${{ secrets.VITE_ARC_GUARD_STORAGE_BUCKET }}
          VITE_ARC_GUARD_MESSAGING_SENDER_ID: ${{ secrets.VITE_ARC_GUARD_MESSAGING_SENDER_ID }}
          VITE_ARC_GUARD_APP_ID: ${{ secrets.VITE_ARC_GUARD_APP_ID }}
          VITE_ARC_GUARD_MEASUREMENT_ID: ${{ secrets.VITE_ARC_GUARD_MEASUREMENT_ID }}
          VITE_ARC_GUARD_VAPID_KEY: ${{ secrets.VITE_ARC_GUARD_VAPID_KEY }}

      # ── 11. Vite build + Capacitor sync — Guard ───────────────────────────────
      - name: Build Guard (Vite + cap sync)
        if: ${{ github.event.inputs.flavor != 'manager' }}
        working-directory: artifacts/arc-guard
        run: pnpm cap:build:guard
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /arc-guard/
          VITE_ARC_GUARD_API_KEY: ${{ secrets.VITE_ARC_GUARD_API_KEY }}
          VITE_ARC_GUARD_AUTH_DOMAIN: ${{ secrets.VITE_ARC_GUARD_AUTH_DOMAIN }}
          VITE_ARC_GUARD_PROJECT_ID: ${{ secrets.VITE_ARC_GUARD_PROJECT_ID }}
          VITE_ARC_GUARD_STORAGE_BUCKET: ${{ secrets.VITE_ARC_GUARD_STORAGE_BUCKET }}
          VITE_ARC_GUARD_MESSAGING_SENDER_ID: ${{ secrets.VITE_ARC_GUARD_MESSAGING_SENDER_ID }}
          VITE_ARC_GUARD_APP_ID: ${{ secrets.VITE_ARC_GUARD_APP_ID }}
          VITE_ARC_GUARD_MEASUREMENT_ID: ${{ secrets.VITE_ARC_GUARD_MEASUREMENT_ID }}
          VITE_ARC_GUARD_VAPID_KEY: ${{ secrets.VITE_ARC_GUARD_VAPID_KEY }}

      # ── 12. Make gradlew executable ───────────────────────────────────────────
      # Must run before either Gradle invocation below.
      - name: Make gradlew executable
        run: chmod +x artifacts/arc-guard/android/gradlew

      # ── 13. Gradle — Manager debug APK ───────────────────────────────────────
      # cap:build:manager already synced the Manager appId/config into android/.
      # Capacitor's standard task is assembleDebug (no product flavors by default).
      # We copy the APK immediately so the Guard build can overwrite dist/ safely.
      - name: Build Manager debug APK
        if: ${{ github.event.inputs.flavor != 'guard' }}
        working-directory: artifacts/arc-guard/android
        run: |
          ./gradlew assembleDebug --no-daemon
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            cp "$APK" "app/build/outputs/apk/ARC-Guard-Manager-debug.apk"
            echo "Manager APK saved: $(du -sh $APK | cut -f1)"
          else
            echo "::error::Manager APK not found at $APK"
            exit 1
          fi
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 14. Gradle — Guard debug APK ─────────────────────────────────────────
      # cap:build:guard re-syncs the Guard appId/config into android/ then we
      # run assembleDebug again to get the Guard-flavoured APK.
      - name: Build Guard debug APK
        if: ${{ github.event.inputs.flavor != 'manager' }}
        working-directory: artifacts/arc-guard
        run: |
          # Re-sync Guard config into android/ (already built Vite in step 14 above,
          # but cap:build:guard also runs pnpm build, which is idempotent here)
          pnpm cap:build:guard
          cd android
          ./gradlew assembleDebug --no-daemon
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            cp "$APK" "app/build/outputs/apk/ARC-Guard-Guard-debug.apk"
            echo "Guard APK saved: $(du -sh $APK | cut -f1)"
          else
            echo "::error::Guard APK not found at $APK"
            exit 1
          fi
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /arc-guard/
          VITE_ARC_GUARD_API_KEY: ${{ secrets.VITE_ARC_GUARD_API_KEY }}
          VITE_ARC_GUARD_AUTH_DOMAIN: ${{ secrets.VITE_ARC_GUARD_AUTH_DOMAIN }}
          VITE_ARC_GUARD_PROJECT_ID: ${{ secrets.VITE_ARC_GUARD_PROJECT_ID }}
          VITE_ARC_GUARD_STORAGE_BUCKET: ${{ secrets.VITE_ARC_GUARD_STORAGE_BUCKET }}
          VITE_ARC_GUARD_MESSAGING_SENDER_ID: ${{ secrets.VITE_ARC_GUARD_MESSAGING_SENDER_ID }}
          VITE_ARC_GUARD_APP_ID: ${{ secrets.VITE_ARC_GUARD_APP_ID }}
          VITE_ARC_GUARD_MEASUREMENT_ID: ${{ secrets.VITE_ARC_GUARD_MEASUREMENT_ID }}
          VITE_ARC_GUARD_VAPID_KEY: ${{ secrets.VITE_ARC_GUARD_VAPID_KEY }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 15. Upload Manager APK ────────────────────────────────────────────────
      - name: Upload Manager APK
        if: ${{ github.event.inputs.flavor != 'guard' }}
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Guard-Manager-debug
          path: artifacts/arc-guard/android/app/build/outputs/apk/ARC-Guard-Manager-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ── 16. Upload Guard APK ──────────────────────────────────────────────────
      - name: Upload Guard APK
        if: ${{ github.event.inputs.flavor != 'manager' }}
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Guard-Guard-debug
          path: artifacts/arc-guard/android/app/build/outputs/apk/ARC-Guard-Guard-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ── 18. Build summary ────────────────────────────────────────────────────
      - name: Write build summary
        if: always()
        run: |
          BASE="artifacts/arc-guard/android/app/build/outputs/apk"
          echo "## ARC Guard Android Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | Package ID | Output |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------------|--------|" >> $GITHUB_STEP_SUMMARY
          [ -f "$BASE/ARC-Guard-Manager-debug.apk" ] && MGR="Built" || MGR="Skipped / Failed"
          [ -f "$BASE/ARC-Guard-Guard-debug.apk" ]   && GRD="Built" || GRD="Skipped / Failed"
          echo "| Manager | com.arcguard.manager | $MGR |" >> $GITHUB_STEP_SUMMARY
          echo "| Guard   | com.arcguard.guard   | $GRD |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Download APKs from the Artifacts section of this run._" >> $GITHUB_STEP_SUMMARY
