name: Build Android APK
# Builds Manager and Guard debug APKs on every push to main

on:
  push:
    branches: [main]
    paths:
      - "artifacts/arc-guard/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "artifacts/arc-guard/**"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Which APK variant to build"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - manager
          - guard

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 3. pnpm ──────────────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      # ── 4. JDK 21 ────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # ── 5. Android SDK 34 ────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      # ── 6. Caches ────────────────────────────────────────────────────────────
      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('artifacts/arc-guard/android/**/*.gradle*', 'artifacts/arc-guard/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 7. Install dependencies ───────────────────────────────────────────────
      - name: Install pnpm dependencies
        run: pnpm install --no-frozen-lockfile

      # ── 8. Bootstrap Android project ─────────────────────────────────────────
      - name: Bootstrap Android project
        working-directory: artifacts/arc-guard
        run: |
          if ! pnpm list @capacitor/android --depth=0 2>/dev/null | grep -q "@capacitor/android"; then
            echo "Installing @capacitor/android..."
            pnpm add @capacitor/android --prefer-offline || pnpm add @capacitor/android
          fi
          if [ -d "android" ]; then
            echo "android/ found in repo — skipping cap add"
          else
            echo "android/ not committed — running cap add android..."
            npx cap add android
            echo "Android project scaffolded"
          fi
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /arc-guard/

      # ── 9. google-services.json ───────────────────────────────────────────────
      - name: Write google-services.json
        run: |
          mkdir -p artifacts/arc-guard/android/app
          DEST="artifacts/arc-guard/android/app/google-services.json"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > "$DEST"
            echo "google-services.json written from GitHub Secret"
          else
            echo "" | base64 -d > "$DEST"
            echo "Using demo placeholder google-services.json"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # ── 10. Vite production build (shared for both APK variants) ──────────────
      # Built once — same JS bundle for Manager and Guard; only the native package
      # ID differs. CAP_ANDROID=1 → base:'./' so file:// assets load on WebView.
      - name: Vite production build
        working-directory: artifacts/arc-guard
        run: pnpm build
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /arc-guard/
          CAP_ANDROID: "1"
          VITE_ARC_GUARD_API_KEY: ${{ secrets.VITE_ARC_GUARD_API_KEY }}
          VITE_ARC_GUARD_AUTH_DOMAIN: ${{ secrets.VITE_ARC_GUARD_AUTH_DOMAIN }}
          VITE_ARC_GUARD_PROJECT_ID: ${{ secrets.VITE_ARC_GUARD_PROJECT_ID }}
          VITE_ARC_GUARD_STORAGE_BUCKET: ${{ secrets.VITE_ARC_GUARD_STORAGE_BUCKET }}
          VITE_ARC_GUARD_MESSAGING_SENDER_ID: ${{ secrets.VITE_ARC_GUARD_MESSAGING_SENDER_ID }}
          VITE_ARC_GUARD_APP_ID: ${{ secrets.VITE_ARC_GUARD_APP_ID }}
          VITE_ARC_GUARD_MEASUREMENT_ID: ${{ secrets.VITE_ARC_GUARD_MEASUREMENT_ID }}
          VITE_ARC_GUARD_VAPID_KEY: ${{ secrets.VITE_ARC_GUARD_VAPID_KEY }}

      # ── 11. Make gradlew executable ───────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x artifacts/arc-guard/android/gradlew

      # ── 12. Manager: cap sync → Gradle → APK ──────────────────────────────────
      # CRITICAL: cap sync and ./gradlew are in the SAME step so that
      # applicationId "com.arcguard.manager" is active in build.gradle when
      # Gradle compiles. Separating these steps was the root cause of both APKs
      # sharing the same package ID and not installing side-by-side.
      - name: Sync Manager config + Build Manager APK
        if: ${{ github.event.inputs.flavor != 'guard' }}
        working-directory: artifacts/arc-guard
        run: |
          echo "=== Syncing Manager config (com.arcguard.manager) into android/ ==="
          # capacitor.config.ts is already the Manager config — sync directly.
          npx cap sync android
          echo ""
          echo "=== Building Manager debug APK ==="
          cd android
          ./gradlew assembleDebug --no-daemon
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            cp "$APK" "app/build/outputs/apk/ARC-Guard-Manager-debug.apk"
            echo "✅ Manager APK saved ($(du -sh "$APK" | cut -f1))"
          else
            echo "::error::Manager APK not found at $APK"
            exit 1
          fi
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /arc-guard/
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 13. Guard: cap sync → Gradle → APK ────────────────────────────────────
      # Switch capacitor.config.ts to Guard variant THEN immediately sync and
      # build. This ensures com.arcguard.guard is in build.gradle when Gradle
      # compiles — giving a completely separate installable APK.
      - name: Sync Guard config + Build Guard APK
        if: ${{ github.event.inputs.flavor != 'manager' }}
        working-directory: artifacts/arc-guard
        run: |
          echo "=== Switching to Guard config (com.arcguard.guard) ==="
          cp capacitor.guard.config.ts capacitor.config.ts
          npx cap sync android
          echo ""
          echo "=== Building Guard debug APK ==="
          cd android
          ./gradlew assembleDebug --no-daemon
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            cp "$APK" "app/build/outputs/apk/ARC-Guard-Guard-debug.apk"
            echo "✅ Guard APK saved ($(du -sh "$APK" | cut -f1))"
          else
            echo "::error::Guard APK not found at $APK"
            exit 1
          fi
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /arc-guard/
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 14. Upload Manager APK ────────────────────────────────────────────────
      - name: Upload Manager APK
        if: ${{ github.event.inputs.flavor != 'guard' }}
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Guard-Manager-debug
          path: artifacts/arc-guard/android/app/build/outputs/apk/ARC-Guard-Manager-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ── 15. Upload Guard APK ──────────────────────────────────────────────────
      - name: Upload Guard APK
        if: ${{ github.event.inputs.flavor != 'manager' }}
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Guard-Guard-debug
          path: artifacts/arc-guard/android/app/build/outputs/apk/ARC-Guard-Guard-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ── 16. Build summary ─────────────────────────────────────────────────────
      - name: Write build summary
        if: always()
        run: |
          BASE="artifacts/arc-guard/android/app/build/outputs/apk"
          echo "## ARC Guard Android Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | Package ID | Output |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------------|--------|" >> $GITHUB_STEP_SUMMARY
          [ -f "$BASE/ARC-Guard-Manager-debug.apk" ] && MGR="✅ Built" || MGR="❌ Skipped / Failed"
          [ -f "$BASE/ARC-Guard-Guard-debug.apk" ]   && GRD="✅ Built" || GRD="❌ Skipped / Failed"
          echo "| Manager | \`com.arcguard.manager\` | $MGR |" >> $GITHUB_STEP_SUMMARY
          echo "| Guard   | \`com.arcguard.guard\`   | $GRD |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Download APKs from the Artifacts section of this run._" >> $GITHUB_STEP_SUMMARY
