name: Build Android APK
# Builds Manager and Guard debug APKs.
#
# Branch strategy:
#   main  → Stable builds  (BUILD_TYPE=stable, default version 1.0)
#   dev   → Test builds    (BUILD_TYPE=test,   default version 1.0)
#
# Manual dispatch lets you choose build_type and version_number explicitly.

on:
  push:
    branches: [main, dev]
    paths:
      - "artifacts/arc-guard/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "artifacts/arc-guard/**"
  workflow_dispatch:
    inputs:
      flavor:
        description: "Which APK variant to build"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - manager
          - guard
      build_type:
        description: "Build type (stable = main release, test = dev branch preview)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - stable
          - test
      version_number:
        description: "Version number e.g. 1.0 or 1.1. Leave blank for branch default."
        required: false
        default: ""
        type: string

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1b. Compute build metadata ───────────────────────────────────────────
      # Sets APP_BUILD_TYPE, APP_VERSION, BUILD_LABEL, BUILD_REF env vars
      # for use in all later steps.
      # Priority: manual input > branch name > default.
      - name: Compute build metadata
        run: |
          # Determine build type
          if [ -n "${{ github.event.inputs.build_type }}" ]; then
            TYPE="${{ github.event.inputs.build_type }}"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            TYPE="test"
          else
            TYPE="stable"
          fi

          # Determine version
          if [ -n "${{ github.event.inputs.version_number }}" ]; then
            VER="${{ github.event.inputs.version_number }}"
          else
            VER="1.0"
          fi

          # Capitalize label: stable → Stable, test → Test
          if [ "$TYPE" = "stable" ]; then LABEL="Stable"; else LABEL="Test"; fi

          echo "APP_BUILD_TYPE=$TYPE"         >> $GITHUB_ENV
          echo "APP_VERSION=$VER"             >> $GITHUB_ENV
          echo "BUILD_LABEL=$LABEL"           >> $GITHUB_ENV
          echo "BUILD_REF=${{ github.ref_name }}" >> $GITHUB_ENV

          echo "┌─ Build Metadata ──────────────────────────"
          echo "│ Branch:      ${{ github.ref_name }}"
          echo "│ Build type:  $TYPE  ($LABEL)"
          echo "│ Version:     $VER"
          echo "│ Flavor:      ${{ github.event.inputs.flavor || 'both' }}"
          echo "└───────────────────────────────────────────"

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 3. pnpm ──────────────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      # ── 4. JDK 21 ────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # ── 5. Android SDK 34 ────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      # ── 6. Caches ────────────────────────────────────────────────────────────
      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-flavors-v1
          restore-keys: |
            gradle-${{ runner.os }}-flavors-
            gradle-${{ runner.os }}-

      # ── 7. Install dependencies ───────────────────────────────────────────────
      - name: Install pnpm dependencies
        run: pnpm install --no-frozen-lockfile

      # ── 8. Build Manager web assets ───────────────────────────────────────────
      # APP_FLAVOR=manager → __APP_FLAVOR__ baked into bundle.
      # APP_VERSION / APP_BUILD_TYPE → version badge baked into the UI.
      - name: Build Manager web assets
        working-directory: artifacts/arc-guard
        run: pnpm build
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /arc-guard/
          CAP_ANDROID: "1"
          APP_FLAVOR: manager
          APP_VERSION: ${{ env.APP_VERSION }}
          APP_BUILD_TYPE: ${{ env.APP_BUILD_TYPE }}
          VITE_ARC_GUARD_API_KEY: ${{ secrets.VITE_ARC_GUARD_API_KEY }}
          VITE_ARC_GUARD_AUTH_DOMAIN: ${{ secrets.VITE_ARC_GUARD_AUTH_DOMAIN }}
          VITE_ARC_GUARD_PROJECT_ID: ${{ secrets.VITE_ARC_GUARD_PROJECT_ID }}
          VITE_ARC_GUARD_STORAGE_BUCKET: ${{ secrets.VITE_ARC_GUARD_STORAGE_BUCKET }}
          VITE_ARC_GUARD_MESSAGING_SENDER_ID: ${{ secrets.VITE_ARC_GUARD_MESSAGING_SENDER_ID }}
          VITE_ARC_GUARD_APP_ID: ${{ secrets.VITE_ARC_GUARD_APP_ID }}
          VITE_ARC_GUARD_MEASUREMENT_ID: ${{ secrets.VITE_ARC_GUARD_MEASUREMENT_ID }}
          VITE_ARC_GUARD_VAPID_KEY: ${{ secrets.VITE_ARC_GUARD_VAPID_KEY }}

      # ── 9. Bootstrap Android project (cap add + cap sync) ─────────────────────
      - name: Bootstrap Android project
        working-directory: artifacts/arc-guard
        run: |
          echo "Scaffolding android/ with Capacitor..."
          npx cap add android
          echo "Syncing web assets into android/..."
          npx cap sync android
          echo "android/app/ contents:"
          ls android/app/
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /arc-guard/

      # ── 10. Write google-services.json ────────────────────────────────────────
      - name: Write google-services.json
        run: |
          DEST="artifacts/arc-guard/android/app/google-services.json"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > "$DEST"
            echo "google-services.json written from GitHub Secret"
          else
            printf '%s' "" | base64 -d > "$DEST"
            echo "Using demo placeholder google-services.json"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # ── 10b. Verify assets copied by cap sync ─────────────────────────────────
      - name: Verify Capacitor assets
        working-directory: artifacts/arc-guard/android
        run: |
          ASSETS="app/src/main/assets/public"
          echo "=== Assets directory ==="
          ls -lh "$ASSETS/" | head -30
          echo ""
          echo "=== index.html (first 30 lines) ==="
          head -30 "$ASSETS/index.html" || echo "index.html NOT FOUND"
          echo ""
          echo "=== assets/ JS files ==="
          ls "$ASSETS/assets/" 2>/dev/null | grep '\.js$' | head -10 || echo "(no JS files found)"

      # ── 10c. Inject CAMERA permission ─────────────────────────────────────────
      - name: Inject CAMERA permission into AndroidManifest
        working-directory: artifacts/arc-guard
        run: python3 android-config/patch_manifest.py

      # ── 11. Patch build.gradle — inject productFlavors ────────────────────────
      - name: Inject productFlavors into build.gradle
        working-directory: artifacts/arc-guard
        run: python3 android-config/patch_gradle.py

      # ── 12. Make gradlew executable ───────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x artifacts/arc-guard/android/gradlew

      # ── 13. Build Manager APK ─────────────────────────────────────────────────
      - name: Build Manager debug APK
        if: ${{ github.event.inputs.flavor != 'guard' }}
        working-directory: artifacts/arc-guard/android
        run: |
          echo "Building Manager APK (com.arcguard.manager) — ${BUILD_LABEL} v${APP_VERSION}..."
          ./gradlew assembleManagerDebug --no-daemon
          APK="app/build/outputs/apk/manager/debug/app-manager-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Manager APK not found at $APK"
            ls -R app/build/outputs/apk/ 2>/dev/null || echo "(no apk output)"
            exit 1
          fi
          OUTNAME="ARC-Guard-Manager-${BUILD_LABEL}-v${APP_VERSION}-debug.apk"
          cp "$APK" "app/build/outputs/apk/${OUTNAME}"
          echo "Manager APK: $(du -sh "$APK" | cut -f1) → ${OUTNAME}"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 13b. Build Guard web assets ───────────────────────────────────────────
      - name: Build Guard web assets
        if: ${{ github.event.inputs.flavor != 'manager' }}
        working-directory: artifacts/arc-guard
        run: pnpm build
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /arc-guard/
          CAP_ANDROID: "1"
          APP_FLAVOR: guard
          APP_VERSION: ${{ env.APP_VERSION }}
          APP_BUILD_TYPE: ${{ env.APP_BUILD_TYPE }}
          VITE_ARC_GUARD_API_KEY: ${{ secrets.VITE_ARC_GUARD_API_KEY }}
          VITE_ARC_GUARD_AUTH_DOMAIN: ${{ secrets.VITE_ARC_GUARD_AUTH_DOMAIN }}
          VITE_ARC_GUARD_PROJECT_ID: ${{ secrets.VITE_ARC_GUARD_PROJECT_ID }}
          VITE_ARC_GUARD_STORAGE_BUCKET: ${{ secrets.VITE_ARC_GUARD_STORAGE_BUCKET }}
          VITE_ARC_GUARD_MESSAGING_SENDER_ID: ${{ secrets.VITE_ARC_GUARD_MESSAGING_SENDER_ID }}
          VITE_ARC_GUARD_APP_ID: ${{ secrets.VITE_ARC_GUARD_APP_ID }}
          VITE_ARC_GUARD_MEASUREMENT_ID: ${{ secrets.VITE_ARC_GUARD_MEASUREMENT_ID }}
          VITE_ARC_GUARD_VAPID_KEY: ${{ secrets.VITE_ARC_GUARD_VAPID_KEY }}

      # ── 13c. Sync Guard web assets into Android ────────────────────────────────
      - name: Sync Guard web assets into Android
        if: ${{ github.event.inputs.flavor != 'manager' }}
        working-directory: artifacts/arc-guard
        run: |
          npx cap sync android
          echo "Guard assets synced. Verifying __APP_FLAVOR__ in bundle:"
          grep -o '"guard"' android/app/src/main/assets/public/assets/*.js | head -3 || echo "(not found in top — check full bundle)"
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /arc-guard/

      # ── 13d. Re-inject CAMERA permission after Guard cap sync ──────────────────
      - name: Re-inject CAMERA permission after Guard cap sync
        if: ${{ github.event.inputs.flavor != 'manager' }}
        working-directory: artifacts/arc-guard
        run: python3 android-config/patch_manifest.py

      # ── 14. Build Guard APK ───────────────────────────────────────────────────
      - name: Build Guard debug APK
        if: ${{ github.event.inputs.flavor != 'manager' }}
        working-directory: artifacts/arc-guard/android
        run: |
          echo "Building Guard APK (com.arcguard.guard) — ${BUILD_LABEL} v${APP_VERSION}..."
          ./gradlew assembleGuardDebug --no-daemon
          APK="app/build/outputs/apk/guard/debug/app-guard-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Guard APK not found at $APK"
            ls -R app/build/outputs/apk/ 2>/dev/null || echo "(no apk output)"
            exit 1
          fi
          OUTNAME="ARC-Guard-Guard-${BUILD_LABEL}-v${APP_VERSION}-debug.apk"
          cp "$APK" "app/build/outputs/apk/${OUTNAME}"
          echo "Guard APK: $(du -sh "$APK" | cut -f1) → ${OUTNAME}"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 15. Verify package IDs with aapt ─────────────────────────────────────
      - name: Verify APK package IDs
        if: always()
        run: |
          if [ -x "$ANDROID_HOME/build-tools/34.0.0/aapt2" ]; then
            AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          else
            AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          fi
          BASE="artifacts/arc-guard/android/app/build/outputs/apk"
          PASS=true

          for ENTRY in "ARC-Guard-Manager-${BUILD_LABEL}-v${APP_VERSION}-debug.apk:com.arcguard.manager" "ARC-Guard-Guard-${BUILD_LABEL}-v${APP_VERSION}-debug.apk:com.arcguard.guard"; do
            FILE="${ENTRY%%:*}"
            WANT="${ENTRY##*:}"
            APK="$BASE/$FILE"
            if [ ! -f "$APK" ]; then
              echo "SKIP $FILE (not built this run)"
              continue
            fi
            echo "--- aapt badging (first 3 lines) ---"
            "$AAPT" dump badging "$APK" 2>&1 | head -3 || true
            echo "------------------------------------"
            BADGE=$("$AAPT" dump badging "$APK" 2>/dev/null)
            GOT=$(printf '%s' "$BADGE" | grep "^package:" | sed "s/^package: name='\([^']*\)'.*/\1/")
            LBL=$(printf '%s' "$BADGE" | grep "^application-label:" | sed "s/application-label:'\([^']*\)'/\1/")
            echo "$FILE -> package='$GOT'  label='$LBL'"
            if [ "$GOT" = "$WANT" ]; then
              echo "  PASS: package ID is correct"
            else
              echo "  INFO: got='$GOT' expected='$WANT' (may be aapt parsing artifact)"
              PASS=false
            fi
          done

          if $PASS; then
            echo "All package IDs verified OK"
          else
            echo "::warning::aapt package-ID check had mismatches — inspect labels above; APKs are still uploaded"
          fi

      # ── 16. Upload Manager APK ────────────────────────────────────────────────
      - name: Upload Manager APK
        if: ${{ always() && github.event.inputs.flavor != 'guard' }}
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Guard-Manager-${{ env.BUILD_LABEL }}-v${{ env.APP_VERSION }}
          path: artifacts/arc-guard/android/app/build/outputs/apk/ARC-Guard-Manager-${{ env.BUILD_LABEL }}-v${{ env.APP_VERSION }}-debug.apk
          if-no-files-found: warn
          retention-days: 30

      # ── 17. Upload Guard APK ──────────────────────────────────────────────────
      - name: Upload Guard APK
        if: ${{ always() && github.event.inputs.flavor != 'manager' }}
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Guard-Guard-${{ env.BUILD_LABEL }}-v${{ env.APP_VERSION }}
          path: artifacts/arc-guard/android/app/build/outputs/apk/ARC-Guard-Guard-${{ env.BUILD_LABEL }}-v${{ env.APP_VERSION }}-debug.apk
          if-no-files-found: warn
          retention-days: 30

      # ── 18. Build summary ─────────────────────────────────────────────────────
      - name: Write build summary
        if: always()
        run: |
          if [ -x "$ANDROID_HOME/build-tools/34.0.0/aapt2" ]; then
            AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          else
            AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          fi
          BASE="artifacts/arc-guard/android/app/build/outputs/apk"
          echo "## ARC Guard Android Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build type | **${BUILD_LABEL}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Version    | **v${APP_VERSION}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch     | \`${BUILD_REF}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | Package ID | App Name | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          for ENTRY in "Manager:ARC-Guard-Manager-${BUILD_LABEL}-v${APP_VERSION}-debug.apk" "Guard:ARC-Guard-Guard-${BUILD_LABEL}-v${APP_VERSION}-debug.apk"; do
            LABEL="${ENTRY%%:*}"
            FILE="${ENTRY##*:}"
            APK="$BASE/$FILE"
            if [ -f "$APK" ]; then
              BADGE=$("$AAPT" dump badging "$APK" 2>/dev/null)
              PKG=$(printf '%s' "$BADGE" | grep "^package:" | sed "s/^package: name='\([^']*\)'.*/\1/")
              NM=$(printf '%s' "$BADGE" | grep "^application-label:" | sed "s/application-label:'\([^']*\)'/\1/")
              echo "| $LABEL | \`$PKG\` | $NM | ✅ Built |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $LABEL | -- | -- | ⏭ Not built |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_APKs uploaded as GitHub Actions artifacts (30-day retention)._" >> $GITHUB_STEP_SUMMARY
          echo "_Names: \`ARC-Guard-Manager-${BUILD_LABEL}-v${APP_VERSION}\` / \`ARC-Guard-Guard-${BUILD_LABEL}-v${APP_VERSION}\`_" >> $GITHUB_STEP_SUMMARY
