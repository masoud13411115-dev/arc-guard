kind = "web"
previewPath = "/arc-guard/"
title = "ARC Guard"
version = "1.0.0"
id = "artifacts/arc-guard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/arc-guard/" ]
localPort = 24640

[services.development]
run = "pnpm --filter @workspace/arc-guard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arc-guard", "run", "build" ]
publicDir = "artifacts/arc-guard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24640"
BASE_PATH = "/arc-guard/"
