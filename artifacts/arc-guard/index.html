  <!-- ── Error capture (runs before any JS bundle) ── -->
  <!-- Collects JS errors and unhandled rejections; visible in Android Logcat -->
  <script>
    window.__arcErrors = [];
    window.onerror = function(msg, src, line, col, err) {
      var entry = { msg: String(msg), src: src, line: line, col: col, stack: err ? err.stack : '' };
      window.__arcErrors.push(entry);
      console.error('[ARC Guard] JS Error:', JSON.stringify(entry));
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      var entry = { msg: String(e.reason), type: 'unhandledrejection' };
      window.__arcErrors.push(entry);
      console.error('[ARC Guard] Unhandled rejection:', JSON.stringify(entry));
    });
  </script>

  <!-- ── Loading screen + error fallback styles ── -->
  <style>
    #arc-loading {
      position: fixed; inset: 0;
      background: #0c1829;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      font-family: system-ui, -apple-system, sans-serif;
      color: rgba(255, 255, 255, 0.7);
      transition: opacity 0.35s ease;
    }
    #arc-loading.arc-hidden { opacity: 0; pointer-events: none; }
    .arc-spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: arc-spin 0.85s linear infinite;
    }
    @keyframes arc-spin { to { transform: rotate(360deg); } }
    #arc-loading p { margin: 16px 0 0; font-size: 13px; letter-spacing: 0.03em; }
    #arc-error {
      display: none;
      position: fixed; inset: 0;
      background: #0c1829;
      flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px; text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
      z-index: 9998;
    }
    #arc-error.arc-show { display: flex; }
    #arc-error h2 { color: #f87171; margin: 0 0 8px; font-size: 16px; font-weight: 600; }
    #arc-error p  { color: rgba(255,255,255,0.6); margin: 0; font-size: 13px; }
    #arc-error button {
      margin-top: 20px; padding: 9px 24px;
      background: #0ea5e9; color: #fff;
      border: none; border-radius: 8px;
      cursor: pointer; font-size: 14px; font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- Loading indicator — visible until React mounts -->
  <div id="arc-loading">
    <div class="arc-spinner"></div>
    <p>در حال بارگذاری...</p>
  </div>

  <!-- Error fallback — shown if app hasn't mounted after 20 s -->
  <div id="arc-error">
    <h2>خطا در بارگذاری برنامه</h2>
    <p>لطفاً برنامه را مجدداً باز کنید</p>
    <button onclick="window.location.reload()">تلاش مجدد</button>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <script>
    // Hide loading screen once React injects content into #root
    (function() {
      var root = document.getElementById('root');
      var loading = document.getElementById('arc-loading');
      if (!root || !loading) return;

      var obs = new MutationObserver(function() {
        if (root.childElementCount > 0) {
          loading.classList.add('arc-hidden');
          setTimeout(function() { loading.remove(); }, 400);
          obs.disconnect();
        }
      });
      obs.observe(root, { childList: true });

      // Fallback: show error screen if app hasn't loaded after 20 s
      setTimeout(function() {
        if (!loading.classList.contains('arc-hidden')) {
          obs.disconnect();
          loading.style.display = 'none';
          var err = document.getElementById('arc-error');
          if (err) err.classList.add('arc-show');
          console.error('[ARC Guard] App failed to load within 20s. Errors:', JSON.stringify(window.__arcErrors || []));
        }
      }, 20000);
    })();
  </script>
</body>
